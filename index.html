<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>움짤 공방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 왼쪽 큰 미리보기 무대(스크롤 고정) + 오른쪽 설정 열. 좁은 화면에서는 위아래로 쌓임 */
:root {
  --bg: #f3f1f5;
  --panel: #ffffff;
  --ink: #26222b;
  --muted: #6d6776;
  --line: #e2dee8;
  --accent: #b4456c;
  --accent-ink: #ffffff;
  --stage: #e8e5ec;
  --display: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141217; --panel: #1e1b22; --ink: #ece8f0; --muted: #a09aa9;
    --line: #322d38; --accent: #e5809f; --accent-ink: #1a1219; --stage: #0d0c10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141217; --panel: #1e1b22; --ink: #ece8f0; --muted: #a09aa9;
  --line: #322d38; --accent: #e5809f; --accent-ink: #1a1219; --stage: #0d0c10;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; margin: 0; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 20px; padding-block: 22px 56px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 18px; }
header.top h1 { font-family: var(--display); font-weight: 700; font-size: 30px; margin: 0; letter-spacing: -0.01em; }
header.top p { margin: 0; color: var(--muted); }
main { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 940px) { main { grid-template-columns: minmax(0, 1fr); } }

.stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); background: var(--stage); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
@media (max-width: 940px) { .stage { position: static; } }
#view { display: block; width: 100%; height: auto; border-radius: 6px; box-shadow: 0 1px 3px rgba(20, 12, 30, .12); touch-action: none; cursor: default; }
#view.drop { outline: 3px dashed var(--accent); outline-offset: 4px; }
.stage-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; color: var(--muted); font-size: 13px; }
.stage-bar .meta { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.stage-bar .hint { margin-left: auto; }
@media (max-width: 600px) { .stage-bar .hint { margin-left: 0; } }

.col { display: grid; gap: 0; min-width: 0; }
.group { padding-block: 18px; border-top: 1px solid var(--line); display: grid; gap: 12px; min-width: 0; }
.group:first-child { border-top: 0; padding-top: 0; }
.group h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.group h2 small { font-weight: 400; letter-spacing: 0; text-transform: none; }

.tpl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tpl { appearance: none; border: 1.5px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 6px 8px; cursor: pointer; display: grid; gap: 6px; text-align: left; color: var(--ink); font: inherit; font-size: 13px; }
.tpl { align-content: start; }
.tpl canvas { width: 100%; height: auto; aspect-ratio: 1280 / 888; object-fit: contain; border-radius: 6px; display: block; background: var(--stage); }
.tpl span { padding-inline: 4px; display: flex; justify-content: space-between; gap: 6px; }
.tpl span em { font-style: normal; color: var(--muted); font-family: var(--mono); font-size: 11px; }
.tpl[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.tpl:hover { border-color: var(--muted); }

.slot { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px; border-radius: 12px; border: 1px solid transparent; }
.slot.is-active { border-color: var(--line); background: var(--panel); }
.slot-thumb { appearance: none; width: 76px; height: 76px; border-radius: 10px; border: 1.5px dashed var(--muted); background: var(--panel); color: var(--muted); cursor: pointer; padding: 0; overflow: hidden; display: grid; place-items: center; font: inherit; font-size: 24px; }
.slot-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.slot-thumb.has { border-style: solid; border-color: var(--line); }
.slot-thumb.circle { border-radius: 50%; }
.slot-body { display: grid; gap: 6px; min-width: 0; }
.slot-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.slot-head strong { font-weight: 600; }
.slot-head span { color: var(--muted); font-size: 12px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.range { display: grid; grid-template-columns: auto minmax(0, 1fr) 3.2em; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.range output { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; font-size: 12px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 10px 18px; font-size: 15px; }
.btn-primary:hover { filter: brightness(1.06); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.field input[type="text"], select { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
.fields { display: grid; gap: 10px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.preset { display: inline-flex; align-items: center; gap: 6px; }
.preset i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line); display: inline-block; }
.colors { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.color { display: grid; gap: 4px; font-size: 12px; color: var(--muted); justify-items: start; }
.color input { width: 100%; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 2px; cursor: pointer; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px 4px 8px; font-size: 13px; cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); margin: 0; }

.export-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.export-row .field { flex: 1 1 120px; }
progress { width: 100%; height: 8px; accent-color: var(--accent); }
.status { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.result { display: grid; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.result img { width: 100%; height: auto; border-radius: 6px; display: block; }
.result p { margin: 0; font-size: 12px; color: var(--muted); }
.result .meta { font-family: var(--mono); font-size: 12px; color: var(--ink); }
</style>

<div class="wrap">
  <header class="top">
    <h1>움짤 공방</h1>
    <p>틀을 고르고, 칸마다 사진을 넣으면 반짝이는 움짤 GIF가 나와요.</p>
  </header>

  <main>
    <div class="stage">
      <canvas id="view" width="1280" height="888" aria-label="움짤 미리보기"></canvas>
      <div class="stage-bar">
        <button class="btn" id="play" type="button">일시정지</button>
        <span class="meta" id="meta">1280 × 888 · 3.0초</span>
        <span class="hint">칸을 눌러 사진 넣기 · 드래그로 위치 · 휠로 확대 · 파일 끌어놓기 · 붙여넣기</span>
      </div>
    </div>

    <div class="col">
      <section class="group">
        <h2>틀 고르기</h2>
        <div class="tpl-grid" id="tpls"></div>
      </section>

      <section class="group">
        <h2>사진 <small id="slot-count"></small></h2>
        <div id="slots"></div>
      </section>

      <section class="group" id="text-group">
        <h2>문구 <small>비워두면 표시하지 않아요</small></h2>
        <div class="fields" id="texts"></div>
      </section>

      <section class="group">
        <h2>꾸미기</h2>
        <div class="presets" id="presets"></div>
        <div class="colors">
          <label class="color">배경<input type="color" id="c-bg"></label>
          <label class="color">글자<input type="color" id="c-ink"></label>
          <label class="color">반짝이<input type="color" id="c-sparkle"></label>
          <label class="color">꽃잎<input type="color" id="c-petal"></label>
        </div>
        <div class="toggles">
          <label class="toggle"><input type="checkbox" id="t-sparkles">반짝이</label>
          <label class="toggle"><input type="checkbox" id="t-glints">빛 반짝임</label>
          <label class="toggle"><input type="checkbox" id="t-dots">먼지 입자</label>
          <label class="toggle"><input type="checkbox" id="t-petals">꽃잎</label>
          <label class="toggle"><input type="checkbox" id="t-float">둥실둥실</label>
          <label class="toggle"><input type="checkbox" id="t-shine">화면 광택</label>
        </div>
        <div class="range"><span>한 바퀴</span><input type="range" id="duration" min="2" max="6" step="0.5"><output id="duration-out"></output></div>
      </section>

      <section class="group">
        <h2>GIF 내보내기</h2>
        <div class="export-row">
          <label class="field">크기
            <select id="scale">
              <option value="1">원본</option>
              <option value="0.75" selected>75%</option>
              <option value="0.5">50%</option>
            </select>
          </label>
          <label class="field">초당 프레임
            <select id="fps">
              <option value="12">12</option>
              <option value="15" selected>15</option>
              <option value="20">20</option>
              <option value="25">25</option>
            </select>
          </label>
          <button class="btn btn-primary" id="make" type="button">GIF 만들기</button>
        </div>
        <div class="status" id="estimate"></div>
        <progress id="progress" max="1" value="0" hidden></progress>
        <div class="result" id="result" hidden>
          <img id="result-img" alt="만들어진 움짤">
          <div class="meta" id="result-meta"></div>
          <div class="btn-row"><a class="btn btn-primary" id="download" download="umjjal.gif" href="#">다운로드</a></div>
          <p>다운로드 버튼이 안 먹히면 위 이미지를 길게 누르거나 우클릭해서 저장하세요.</p>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;

/* ───────────── 공통 그리기 도구 ───────────── */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rr(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function sparklePath(ctx, r) {
  const k = r * 0.16;
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.quadraticCurveTo(k, -k, r, 0);
  ctx.quadraticCurveTo(k, k, 0, r);
  ctx.quadraticCurveTo(-k, k, -r, 0);
  ctx.quadraticCurveTo(-k, -k, 0, -r);
  ctx.closePath();
}
const twinkle = (ph, sp, p) => Math.pow(Math.max(0, Math.sin(TAU * (p * sp + ph))), 2);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const FONT_BODY = '"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
const FONT_DISPLAY = '"Gowun Batang", "Nanum Myeongjo", serif';
const FONT_HAND = '"Gaegu", "Gowun Batang", cursive';

/* 배경 효과: 반짝이(외곽선), 먼지, 빛 반짝임, 꽃잎. 모두 한 바퀴(p: 0→1) 주기로 이어지게 계산 */
const ambientCache = new Map();
function ambient(W, H, seed) {
  const key = W + 'x' + H + ':' + seed;
  if (ambientCache.has(key)) return ambientCache.get(key);
  const R = mulberry32(seed);
  const a = { outline: [], dots: [], glints: [], petals: [] };
  for (let i = 0; i < 16; i++) a.outline.push({ x: R() * W, y: R() * H, r: 6 + R() * 8, ph: R(), sp: 1 + (R() * 2 | 0), rot: (R() - .5) * .5 });
  for (let i = 0; i < 46; i++) a.dots.push({ x: R() * W, y: R() * H, r: .9 + R() * 1.9, a: .12 + R() * .28, k: 1 + (R() * 2 | 0), wob: R() });
  for (let i = 0; i < 12; i++) a.glints.push({ x: R() * W, y: R() * H, r: 7 + R() * 11, ph: R(), sp: 1 + (R() * 2 | 0) });
  for (let i = 0; i < 13; i++) a.petals.push({ x: R() * W, y: R() * H, w: 6 + R() * 6, ph: R(), amp: 15 + R() * 30, spin: R() < .5 ? -1 : 1, tilt: R() * TAU });
  ambientCache.set(key, a);
  return a;
}
function drawBack(ctx, tpl, p, o) {
  const a = ambient(tpl.W, tpl.H, tpl.seed);
  ctx.fillStyle = o.bg;
  ctx.fillRect(0, 0, tpl.W, tpl.H);
  if (o.dots) {
    const H = tpl.H + 20;
    ctx.fillStyle = o.sparkle;
    for (const d of a.dots) {
      const y = ((d.y - p * d.k * H) % H + H) % H - 10;
      const x = d.x + Math.sin(TAU * (p + d.wob)) * 6;
      ctx.globalAlpha = d.a;
      ctx.beginPath(); ctx.arc(x, y, d.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  if (o.sparkles) {
    ctx.strokeStyle = o.sparkle;
    ctx.lineWidth = 1.5;
    for (const s of a.outline) {
      const tw = twinkle(s.ph, s.sp, p);
      if (tw < .02) continue;
      ctx.save();
      ctx.translate(s.x, s.y); ctx.rotate(s.rot);
      ctx.globalAlpha = .25 + .75 * tw;
      sparklePath(ctx, s.r * (.55 + .45 * tw));
      ctx.stroke();
      ctx.restore();
    }
  }
}
function drawFront(ctx, tpl, p, o) {
  const a = ambient(tpl.W, tpl.H, tpl.seed);
  if (o.glints) {
    for (const g of a.glints) {
      const tw = twinkle(g.ph, g.sp, p);
      if (tw < .03) continue;
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.globalAlpha = tw;
      ctx.shadowColor = o.sparkle; ctx.shadowBlur = 10 * tw;
      ctx.fillStyle = '#ffffff';
      sparklePath(ctx, g.r * (.3 + .7 * tw));
      ctx.fill();
      ctx.restore();
    }
  }
  if (o.petals) {
    const H = tpl.H + 60;
    ctx.fillStyle = o.petal;
    for (const pt of a.petals) {
      const y = (pt.y + p * H) % H - 30;
      const x = pt.x + Math.sin(TAU * (p + pt.ph)) * pt.amp;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(pt.tilt + TAU * p * pt.spin);
      ctx.scale(1, .55 + .35 * Math.sin(TAU * (p * 2 + pt.ph)));
      ctx.globalAlpha = .8;
      ctx.beginPath();
      ctx.moveTo(0, -pt.w);
      ctx.bezierCurveTo(pt.w * .9, -pt.w * .7, pt.w * .7, pt.w * .8, 0, pt.w);
      ctx.bezierCurveTo(-pt.w * .7, pt.w * .8, -pt.w * .9, -pt.w * .7, 0, -pt.w);
      ctx.fill();
      ctx.restore();
    }
  }
}

/* 사진 칸 */
function shapePath(ctx, s) {
  if (s.shape === 'circle') { ctx.beginPath(); ctx.arc(0, 0, s.w / 2, 0, TAU); }
  else rr(ctx, -s.w / 2, -s.h / 2, s.w, s.h, s.r || 0);
}
function coverSize(img, s, zoom) {
  const base = Math.max(s.w / img.width, s.h / img.height) * zoom;
  return { dw: img.width * base, dh: img.height * base };
}
function drawSlot(ctx, tpl, s, env) {
  const st = slotState(tpl.id, s.id);
  ctx.save();
  shapePath(ctx, s);
  ctx.clip();
  if (st.img) {
    const { dw, dh } = coverSize(st.img, s, st.zoom);
    ctx.drawImage(st.img, -dw / 2 + st.ox, -dh / 2 + st.oy, dw, dh);
  } else {
    const g = ctx.createLinearGradient(-s.w / 2, -s.h / 2, s.w / 2, s.h / 2);
    g.addColorStop(0, '#ece4f1'); g.addColorStop(1, '#f6d9e3');
    ctx.fillStyle = g;
    ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
    if (env.preview) {
      const m = Math.min(s.w, s.h);
      ctx.fillStyle = 'rgba(112, 82, 124, .8)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `600 ${Math.round(m * .085)}px ${FONT_BODY}`;
      ctx.fillText('+ 사진 넣기', 0, -m * .04);
      ctx.font = `400 ${Math.round(m * .06)}px ${FONT_BODY}`;
      ctx.fillText(s.label, 0, m * .07);
    }
  }
  ctx.restore();
  if (env.preview && env.hover === s.id) {
    ctx.save();
    shapePath(ctx, s);
    ctx.setLineDash([10, 8]);
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#b4456c';
    ctx.stroke();
    ctx.restore();
  }
}

/* 폰 */
function phoneScreen(w, h) {
  const i = Math.round(w * .034), R = w * .155;
  return { w: w - 2 * i, h: h - 2 * i, r: R - i };
}
function drawPhone(ctx, w, h, p, o, drawScreen) {
  const R = w * .155, sc = phoneScreen(w, h), sw = sc.w, sh = sc.h;
  ctx.fillStyle = '#7d7b82';
  rr(ctx, -w / 2 - 2.5, -h * .30, 5, h * .045, 2); ctx.fill();
  rr(ctx, -w / 2 - 2.5, -h * .22, 5, h * .08, 2); ctx.fill();
  rr(ctx, -w / 2 - 2.5, -h * .12, 5, h * .08, 2); ctx.fill();
  rr(ctx, w / 2 - 2.5, -h * .18, 5, h * .12, 2); ctx.fill();
  ctx.save();
  ctx.shadowColor = 'rgba(46, 32, 58, .28)';
  ctx.shadowBlur = w * .14; ctx.shadowOffsetY = w * .05;
  const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  g.addColorStop(0, '#5c5a60'); g.addColorStop(.12, '#cfcdd3'); g.addColorStop(.5, '#8e8c93');
  g.addColorStop(.88, '#d6d4da'); g.addColorStop(1, '#5c5a60');
  ctx.fillStyle = g;
  rr(ctx, -w / 2, -h / 2, w, h, R); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#0e0d10';
  rr(ctx, -w / 2 + 3, -h / 2 + 3, w - 6, h - 6, R - 3); ctx.fill();
  drawScreen();
  if (o.shine) {
    ctx.save();
    rr(ctx, -sw / 2, -sh / 2, sw, sh, sc.r); ctx.clip();
    const x = -sw * 1.3 + p * sw * 3.6;
    ctx.translate(x, 0); ctx.rotate(.38);
    const bg = ctx.createLinearGradient(-70, 0, 70, 0);
    bg.addColorStop(0, 'rgba(255,255,255,0)'); bg.addColorStop(.5, 'rgba(255,255,255,.26)'); bg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(-70, -h, 140, h * 2);
    ctx.restore();
  }
  ctx.fillStyle = '#000';

function toCanvas(e) {

async function loadInto(slotId, file) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.decoding = 'async';
  img.src = url;
  try { await img.decode(); } catch (err) { setStatus('이 파일은 이미지로 읽을 수 없어요. JPG, PNG, WEBP 파일을 넣어주세요.'); return; }
  const MAX = 2000;
  let src = img;
  if (Math.max(img.naturalWidth, img.naturalHeight) > MAX) {
    const k = MAX / Math.max(img.naturalWidth, img.naturalHeight);
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    src = c;

  const st = slotState(state.tpl.id, slotId);
  if (st.url) URL.revokeObjectURL(st.url);
  Object.assign(st, { img: src, url, name: file.name || '붙여넣은 이미지', zoom: 1, ox: 0, oy: 0 });
  setActive(slotId);
  buildSlots();
}

/* ───────────── GIF 인코더 (팔레트 256색, LZW) ───────────── */
class ByteOut {
  constructor() { this.buf = new Uint8Array(1 << 20); this.n = 0; }
  ensure(k) {
    if (this.n + k <= this.buf.length) return;
    const nb = new Uint8Array(Math.max(this.buf.length * 2, this.n + k));
    nb.set(this.buf.subarray(0, this.n)); this.buf = nb;
  }
  b(v) { this.ensure(1); this.buf[this.n++] = v; }
  w(v) { this.b(v & 255); this.b(v >> 8 & 255); }
  s(str) { for (let i = 0; i < str.length; i++) this.b(str.charCodeAt(i)); }
  bytes(a) { this.ensure(a.length); this.buf.set(a, this.n); this.n += a.length; }
  result() { return this.buf.slice(0, this.n); }
}
// 15비트 색상 히스토그램 위에서 median cut으로 256색 팔레트를 만든다
function quantize(rgba, npx) {
  const hist = new Uint32Array(32768), keys = new Uint16Array(npx);
  for (let i = 0, j = 0; j < npx; i += 4, j++) {
    const k = ((rgba[i] >> 3) << 10) | ((rgba[i + 1] >> 3) << 5) | (rgba[i + 2] >> 3);
    keys[j] = k; hist[k]++;
  }
  const used = [];
  for (let k = 0; k < 32768; k++) if (hist[k]) used.push(k);
  const lut = new Uint8Array(32768), palette = new Uint8Array(768);
  const ch = (k, c) => c === 0 ? k >> 10 : c === 1 ? (k >> 5) & 31 : k & 31;
  if (used.length <= 256) {
    used.forEach((k, i) => {
      lut[k] = i;
      for (let c = 0; c < 3; c++) palette[i * 3 + c] = ch(k, c) * 8 + 4;
    });
  } else {
    const box = list => {
      let pop = 0; const mn = [31, 31, 31], mx = [0, 0, 0];
      for (const k of list) {
        pop += hist[k];
        for (let c = 0; c < 3; c++) { const v = ch(k, c); if (v < mn[c]) mn[c] = v; if (v > mx[c]) mx[c] = v; }
      }
      const rg = [mx[0] - mn[0], (mx[1] - mn[1]) * 1.2, (mx[2] - mn[2]) * .9];
      const axis = rg[0] >= rg[1] && rg[0] >= rg[2] ? 0 : rg[1] >= rg[2] ? 1 : 2;
      return { list, pop, axis, score: rg[axis] * Math.sqrt(pop) };
    };
    const boxes = [box(used)];
    while (boxes.length < 256) {
      let bi = -1, bs = 0;
      for (let i = 0; i < boxes.length; i++) if (boxes[i].list.length > 1 && boxes[i].score > bs) { bs = boxes[i].score; bi = i; }
      if (bi < 0) break;
      const b = boxes[bi];
      b.list.sort((x, y) => ch(x, b.axis) - ch(y, b.axis));
      let acc = 0, cut = 1;
      for (let i = 0; i < b.list.length - 1; i++) { acc += hist[b.list[i]]; if (acc >= b.pop / 2) { cut = i + 1; break; } cut = i + 1; }
      boxes.splice(bi, 1, box(b.list.slice(0, cut)), box(b.list.slice(cut)));
    }
    boxes.forEach((b, i) => {
      let r = 0, g = 0, bl = 0;
      for (const k of b.list) { const n = hist[k]; r += ch(k, 0) * n; g += ch(k, 1) * n; bl += ch(k, 2) * n; lut[k] = i; }
      palette[i * 3] = Math.round(r / b.pop * 8 + 4);
      palette[i * 3 + 1] = Math.round(g / b.pop * 8 + 4);
      palette[i * 3 + 2] = Math.round(bl / b.pop * 8 + 4);
    });
  }
  const index = new Uint8Array(npx);
  for (let j = 0; j < npx; j++) index[j] = lut[keys[j]];
  return { palette, index };
}
const DICT_CODE = new Int16Array(4096 * 256), DICT_GEN = new Uint32Array(4096 * 256);
let dictGen = 0;
function lzw(out, idx, minCode) {
  out.b(minCode);
  const clear = 1 << minCode, eoi = clear + 1;
  let nBits = minCode + 1, maxcode = (1 << nBits) - 1, free = clear + 2, clearFlg = false;
  let acc = 0, accBits = 0, bl = 0;
  const blk = new Uint8Array(255);
  dictGen++;
  const put = v => { blk[bl++] = v; if (bl === 255) { out.b(255); out.bytes(blk); bl = 0; } };
  const output = code => {
    acc |= code << accBits; accBits += nBits;
    while (accBits >= 8) { put(acc & 255); acc >>>= 8; accBits -= 8; }
    if (free > maxcode || clearFlg) {
      if (clearFlg) { nBits = minCode + 1; maxcode = (1 << nBits) - 1; clearFlg = false; }
      else { nBits++; maxcode = nBits === 12 ? 4096 : (1 << nBits) - 1; }
    }
  };
  output(clear);
  let ent = idx[0];
  for (let i = 1; i < idx.length; i++) {
    const c = idx[i], key = (ent << 8) | c;
    if (DICT_GEN[key] === dictGen) { ent = DICT_CODE[key]; continue; }
    output(ent);
    ent = c;
    if (free < 4096) { DICT_CODE[key] = free++; DICT_GEN[key] = dictGen; }
    else { dictGen++; free = clear + 2; clearFlg = true; output(clear); }
  }
  output(ent); output(eoi);
  if (accBits > 0) put(acc & 255);
  if (bl) { out.b(bl); out.bytes(blk.subarray(0, bl)); }
  out.b(0);
}
class GifWriter {
  constructor(w, h) {
    this.w = w; this.h = h; this.out = new ByteOut();
    const o = this.out;
    o.s('GIF89a'); o.w(w); o.w(h); o.b(0); o.b(0); o.b(0);
    o.b(0x21); o.b(0xFF); o.b(11); o.s('NETSCAPE2.0'); o.b(3); o.b(1); o.w(0); o.b(0);
  }
  addFrame(rgba, delayCs) {
    const o = this.out, { palette, index } = quantize(rgba, this.w * this.h);
    o.b(0x21); o.b(0xF9); o.b(4); o.b(1 << 2); o.w(delayCs); o.b(0); o.b(0);
    o.b(0x2C); o.w(0); o.w(0); o.w(this.w); o.w(this.h); o.b(0x87);
    o.bytes(palette);
    lzw(o, index, 8);
  }
  finish() { this.out.b(0x3B); return this.out.result(); }
}

/* ───────────── 내보내기 ───────────── */
let lastUrl = '';
let busy = false;
async function exportGif() {
  if (busy) return;
  busy = true;
  const btn = $('make'), prog = $('progress');
  btn.disabled = true; prog.hidden = false; prog.value = 0;
  try {
    await document.fonts.ready;
    const tpl = state.tpl, sc = +$('scale').value, fps = +$('fps').value;
    const W = Math.round(tpl.W * sc), H = Math.round(tpl.H * sc);
    const n = Math.max(2, Math.round(state.o.duration * fps));
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    const gif = new GifWriter(W, H);
    const t0 = performance.now();
    for (let i = 0; i < n; i++) {
      ctx.setTransform(sc, 0, 0, sc, 0, 0);
      renderFrame(ctx, tpl, i / n, false);
      const data = ctx.getImageData(0, 0, W, H).data;
      const delay = Math.round((i + 1) * 100 / fps) - Math.round(i * 100 / fps);
      gif.addFrame(data, delay);
      prog.value = (i + 1) / n;
      setStatus(`프레임 만드는 중 ${i + 1} / ${n}`);
      await new Promise(r => setTimeout(r, 0));
    }
    const blob = new Blob([gif.finish()], { type: 'image/gif' });
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    $('result-img').src = lastUrl;
    $('download').href = lastUrl;
    $('download').download = `umjjal-${tpl.id}.gif`;
    const mb = blob.size / 1048576;
    $('result-meta').textContent = `${W} × ${H}px · ${n}프레임 · ${mb >= 1 ? mb.toFixed(1) + 'MB' : Math.round(blob.size / 1024) + 'KB'}`;
    $('result').hidden = false;
    setStatus(`완성했어요 (${((performance.now() - t0) / 1000).toFixed(1)}초 걸림)`);
  } catch (err) {
    console.error(err);
    setStatus('GIF를 만들다 멈췄어요. 크기를 50%로 줄이거나 초당 프레임을 낮춰서 다시 해보세요.');
  } finally {
    busy = false; btn.disabled = false; prog.hidden = true;
  }
}
$('make').addEventListener('click', exportGif);
